[package]
name = "mivi-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GGUF parser, hybrid LFM architecture (SSM+GQA), LoRA adapters, forward pass, and sampling"

[features]
fixture-diagnostics = []
projection-diagnostics = ["fixture-diagnostics", "mivi-quant/projection-diagnostics"]

[dependencies]
mivi-core.workspace = true
mivi-quant.workspace = true
mivi-tokenizer.workspace = true
mivi-kv.workspace = true
thiserror.workspace = true
memmap2.workspace = true
byteorder.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
rayon.workspace = true
tempfile = "3"
libc.workspace = true

[[example]]
name = "runtime_replay"
required-features = ["fixture-diagnostics"]

[[example]]
name = "projection_measure"
required-features = ["projection-diagnostics"]
