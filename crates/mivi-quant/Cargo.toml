[package]
name = "mivi-quant"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Quantization types (Q4_K_M, Q8_0, F16), block layouts, dequantization, and matrix-vector compute"

[features]
batch-scratch-experiment = []
batch-four-row-experiment = ["batch-scratch-experiment", "mivi-core/batch-four-row-experiment"]
q4-cached-sums-experiment = ["mivi-core/q4-cached-sums-experiment"]
projection-diagnostics = []
projection-locality-experiment = []

[dependencies]
mivi-core.workspace = true
thiserror.workspace = true
half.workspace = true
byteorder.workspace = true
rayon.workspace = true
tracing.workspace = true

[dev-dependencies]
mivi-model = { path = "../mivi-model" }
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"] }
