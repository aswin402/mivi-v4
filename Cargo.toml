[workspace]
members = [
    "crates/mivi-core",
    "crates/mivi-quant",
    "crates/mivi-tokenizer",
    "crates/mivi-model",
    "crates/mivi-kv",
    "crates/mivi-context",
    "crates/mivi-memory",
    "crates/mivi-tools",
    "crates/mivi-router",
    "crates/mivi-agent",
    "crates/mivi-server",
    "crates/mivi-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["mivi team"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mivi-ai/mivi-v4"

[workspace.dependencies]
# Workspace Crates
mivi-core = { path = "crates/mivi-core" }
mivi-quant = { path = "crates/mivi-quant" }
mivi-tokenizer = { path = "crates/mivi-tokenizer" }
mivi-model = { path = "crates/mivi-model" }
mivi-kv = { path = "crates/mivi-kv" }
mivi-context = { path = "crates/mivi-context" }
mivi-memory = { path = "crates/mivi-memory" }
mivi-tools = { path = "crates/mivi-tools" }
mivi-router = { path = "crates/mivi-router" }
mivi-agent = { path = "crates/mivi-agent" }
mivi-server = { path = "crates/mivi-server" }
mivi-cli = { path = "crates/mivi-cli" }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Numerical & Tensor / Low-level
half = { version = "2.4", features = ["serde", "num-traits"] }
memmap2 = "0.9"
byteorder = "1.5"
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI & Observability
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
regex = "1.11"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
subtle = "2.6"

[package]
name = "mivi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CPU-first, low-memory, agent-native SLM engine"

[dependencies]
mivi-core.workspace = true
mivi-quant.workspace = true
mivi-tokenizer.workspace = true
mivi-model.workspace = true
mivi-kv.workspace = true
mivi-context.workspace = true
mivi-memory.workspace = true
mivi-tools.workspace = true
mivi-router.workspace = true
mivi-agent.workspace = true
mivi-server.workspace = true
mivi-cli.workspace = true

axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util = "0.1"
serde_json.workspace = true
serde.workspace = true
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
debug = true

[profile.dev.package."*"]
opt-level = 2
